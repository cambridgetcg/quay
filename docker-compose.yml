# Local Quay — `docker compose up`, then open http://quay.localhost:7000
# (*.localhost resolves to 127.0.0.1 in every modern browser, so previews work
# with no DNS and no TLS). The data volume persists deploys across restarts.
services:
  quayd:
    image: node:20-alpine
    working_dir: /app
    command: node bin/quayd.js
    environment:
      QUAY_DATA: /data
      QUAY_PORT: "7000"
      QUAY_BIND: "0.0.0.0"   # inside the container only; the published port is loopback-bound below
      QUAY_ADMIN_HOST: quay.localhost
      QUAY_DEPLOY_SUFFIX: quay.localhost
    ports:
      - "127.0.0.1:7000:7000"   # strictly local — compose is for dev, not exposure
    volumes:
      - ./src:/app/src:ro
      - ./bin:/app/bin:ro
      - ./package.json:/app/package.json:ro
      - quay-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  quay-data:
